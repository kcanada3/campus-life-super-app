<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campus Life Super App</title>

        <!-- Link to Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" 
        crossorigin="anonymous">

        <!-- Link to the stylesheet called style.css -->
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <div class="container-fluid px-0">
            <header class="text-start mb-4">
                <div class ="title-row">
                    <img class="hornet-class" alt="Hornet Logo" src="./images/hornet-logo.jpg"/>
                    <!-- This is the title of the page -->
                    <h1 class="title">University of Lynchburg</h1>
                </div>
                <nav class="top-nav" aria-label="Main navigation">
                    <ul>
                        <li><a href="./index.html">Home</a></li>
                        <li><a class="active" href="./events.html" aria-current="page">Events</a></li>
                        <li><a href="./dining.html">Dining</a></li>
                        <li><a href="./study.html">Study</a></li>
                    </ul>
                </nav>
            </header>
            <main>
                <!-- Header for the events page -->
                <section class="home-section">
                    <div class="home-text">
                        <h2>Campus Events</h2>
                        <p>Discover upcoming events, activities, and opportunities around campus.</p>
                    </div>
                    <img class="campus-class" alt="Image of Dell the mascot" src="./images/dell.jpeg"/>
                </section>

                <form class="event-filters" role="search">
                    <div class="filter-group filter-search">
                        <label for="event-search">Search</label>
                        <input type="search" id="event-search" name="search" placeholder="Search events">
                    </div>

                    <div class="filter-group">
                        <label for="event-category">Category</label>
                        <select id="event-category" name="category">
                            <option value="">All categories</option>
                            <option value="athletics">Athletics</option>
                            <option value="arts">Arts</option>
                            <option value="academic">Academic</option>
                            <option value="social">Social</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="event-date">Date</label>
                        <input type="date" id="event-date" name="date">
                    </div>
                </form>

                <!-- Event Cards -->
                <div class="card-row">
                    <!-- These are the event cards with the event information -->
                    <section class="col-md-4">

                    </section>

                    <!-- This is the campus events card -->
                    <section class="col-md-4">

                    </section>

                    <!-- This is the dining services card -->
                    <section class="col-md-4">

                    </section>
                </div>
            </main>
        </div>
    </body>
</html>
