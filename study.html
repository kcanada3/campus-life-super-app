<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campus Life Super App</title>

        <!-- Link to Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" 
        crossorigin="anonymous">

        <!-- Link to the stylesheet called style.css -->
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <div class="container-fluid px-0">
            <header class="text-start mb-4">
                <div class ="title-row">
                    <img class="hornet-class" alt="Hornet Logo" src="./images/hornet-logo.jpg"/>
                    <!-- This is the title of the page -->
                    <h1 class="title">University of Lynchburg</h1>
                </div>
                <nav class="top-nav" aria-label="Main navigation">
                    <ul>
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./events.html">Events</a></li>
                        <li><a href="./dining.html">Dining</a></li>
                        <li><a class="active" href="./study.html" aria-current="page">Study</a></li>
                    </ul>
                </nav>
            </header>
            <main>
                <!-- Header for the study page -->
                <section class="home-section">
                    <div class="home-text">
                        <h2>Study Spots</h2>
                        <p>Find the best places on campus to study, from quiet spaces to group areas.</p>
                    </div>
                    <img class="campus-class" alt="Image of Schewel Hall" src="./images/schewel.jpg"/>
                </section>

                <form class="study-filters" role="search">
                    <div class="filter-group filter-search">
                        <label for="study-search">Search</label>
                        <input type="search" id="study-search" name="search" placeholder="Search study spots">
                    </div>

                    <div class="filter-group">
                        <label for="study-type">Type</label>
                        <select id="study-type" name="type">
                            <option value="">All types</option>
                            <option value="quiet">Quiet</option>
                            <option value="group">Group study</option>
                            <option value="outdoor">Outdoor</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="study-amenity">Amenities</label>
                        <select id="study-amenity" name="amenity">
                            <option value="">All amenities</option>
                            <option value="wifi">Wi-Fi</option>
                            <option value="outlets">Outlets</option>
                            <option value="whiteboards">Whiteboards</option>
                        </select>
                    </div>
                </form>
            </main>
        </div>
    </body>
</html>
